name: CI

on:
  push:
    branches: [main, develop]
    paths:
      - "src/**"
      - "tests/**"
      - "pyproject.toml"
      - "requirements.txt"
      - ".github/workflows/**"
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package-contract:
    name: Python ${{ matrix.python-version }} package contract
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package and development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Compile active source and benchmark code
        run: |
          python -m compileall -q src benchmarks tests

      - name: Exercise the active V1 public contract
        run: |
          python - <<'PY'
          import torch

          from src.drai import (
              DRAIV1ResonanceLayer,
              V1Config,
              apply_v1,
              get_v1_conservative,
              get_v1_stats,
          )

          config = get_v1_conservative()
          assert isinstance(config, V1Config)
          assert config.algorithm_type == "v1"
          assert config.resolve_layers(24) == [11, 12]

          layer = DRAIV1ResonanceLayer(
              hidden_size=128,
              num_heads=2,
              head_dim=8,
              max_attractors=4,
              burn_in_threshold=0.0,
          )
          query = torch.randn(3, 2, 4, 8)
          keys, values = layer(query)

          assert keys.shape == (3, 2, 2, 8)
          assert values.shape == (3, 2, 2, 8)
          assert torch.isfinite(keys).all()
          assert torch.isfinite(values).all()
          assert layer.timestep.item() == 1.0

          stats = layer.get_stats()
          assert stats["num_alive"] > 0
          assert stats["timestep"] == 1.0

          assert callable(apply_v1)
          assert callable(get_v1_stats)
          print("Active DRAI V1 API contract passed")
          PY

  environment-tests:
    name: PyTorch environment tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run PyTorch and transformer primitives
        run: python -m pytest tests/environment/test_pytorch_installation.py

  legacy-unit-tests:
    name: Legacy Phase 2 unit tests (informational)
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Detect archived Phase 2 API
        id: phase2_api
        run: |
          python - <<'PY'
          import os
          import src.drai

          available = hasattr(src.drai, "DraiResonanceLayer")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"available={'true' if available else 'false'}\n")
          print(f"Archived Phase 2 API available: {available}")
          PY

      - name: Run the committed Phase 2 test suite when its API exists
        if: steps.phase2_api.outputs.available == 'true'
        run: python -m pytest tests/unit

      - name: Explain legacy-suite skip
        if: steps.phase2_api.outputs.available != 'true'
        run: |
          echo "The committed tests/unit suite targets the archived Phase 2 API."
          echo "The active package exposes the production V1 API instead."
          echo "The archived suite was skipped because DraiResonanceLayer is not present."
          echo "This job is intentionally informational until those tests are migrated."
