name: AD FS automation syntax

on:
  pull_request:
    paths:
      - 'automation/adfs/**'
      - '.github/workflows/adfs-automation.yml'
  push:
    branches: [main]
    paths:
      - 'automation/adfs/**'
      - '.github/workflows/adfs-automation.yml'

permissions:
  contents: read

jobs:
  powershell-syntax:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse PowerShell scripts
        shell: pwsh
        run: ./automation/adfs/Test-AdfsAutomationSyntax.ps1
